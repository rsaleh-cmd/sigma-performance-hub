const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  hireDate: "hire_date",
  teamLead: "team_lead",
  pulseChecks: "pulse_checks",
  actionPlan: "action_plan",
  photo: "photo_url",
};

function rowToEmployee(row) {
  return {
    id: row.id,
    name: row.name,
    role: row.role,
    department: row.department,
    hireDate: row.hire_date,
    trainer: row.trainer,
    teamLead: row.team_lead,
    batch: row.batch,
    status: row.status,
    rag: row.rag,
    photo: row.photo_url,
    training: row.training || [],
    assessments: row.assessments || [],
    pulseChecks: row.pulse_checks || [],
    qa: row.qa || [],
    strengths: row.strengths || [],
    weaknesses: row.weaknesses || [],
    actionPlan: row.action_plan || [],
  };
}

async function fetchEmployees() {
  const { data, error } = await supabase.from("employees").select("*").order("name");
  if (error) {
    console.error("Failed to load employees:", error.message);
    return [];
  }
  return data.map(rowToEmployee);
}

async function updateEmployeeField(id, field, value) {
  const column = FIELD_TO_COLUMN[field] || field;
  const { error } = await supabase.from("employees").update({ [column]: value }).eq("id", id);
  if (error) console.error("Failed to save change:", error.message);
  return error;
}

async function uploadEmployeePhoto(blob, employeeId) {
  const path = `${employeeId}/${Date.now()}.jpg`;
  const { error: uploadError } = await supabase.storage
    .from("employee-photos")
    .upload(path, blob, { upsert: true, contentType: "image/jpeg" });
  if (uploadError) throw uploadError;
  const { data } = supabase.storage.from("employee-photos").getPublicUrl(path);
  return data.publicUrl;
}

/* ============================== HELPERS ============================== */

const ragColor = (rag) =>
  rag === "Green" ? "var(--rag-green)" : rag === "Amber" ? "var(--rag-amber)" : "var(--rag-red)";

const avg = (arr, key) => {
  const vals = arr.map((x) => x[key]).filter((v) => typeof v === "number");
  if (!vals.length) return null;
  return Math.round((vals.reduce((a, b) => a + b, 0) / vals.length) * 10) / 10;
};

const compositeScore = (emp) => {
  const a = avg(emp.assessments, "score");
  const p = avg(emp.pulseChecks, "score");
  const q = avg(emp.qa, "overall");
  const vals = [a, p, q].filter((v) => v !== null);
  if (!vals.length) return 0;
  return Math.round(vals.reduce((x, y) => x + y, 0) / vals.length);
};

const initials = (name) =>
  name.split(" ").map((p) => p[0]).slice(0, 2).join("").toUpperCase();

function resizeImageToBlob(file, maxSize = 300) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        let { width, height } = img;
        if (width > height) {
          if (width > maxSize) { height *= maxSize / width; width = maxSize; }
        } else {
          if (height > maxSize) { width *= maxSize / height; height = maxSize; }
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => resolve(blob), "image/jpeg", 0.85);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============================== SMALL PIECES ============================== */

function OrbitAvatar({ photo, name, score, size = 64 }) {
  const r = size / 2 - 5;
  const c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(100, score));
  const dash = (pct / 100) * c;
  return (
    <div className="orbit-avatar" style={{ width: size, height: size }}>
      <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size}>
        <circle cx={size / 2} cy={size / 2} r={r} className="orbit-track" />
        <circle
          cx={size / 2} cy={size / 2} r={r}
          className="orbit-progress"
          strokeDasharray={`${dash} ${c}`}
          transform={`rotate(-90 ${size / 2} ${size / 2})`}
        />
      </svg>
      <div className="orbit-inner">
        {photo ? (
          <img src={photo} alt={name} />
        ) : (
          <span className="orbit-initials">{initials(name)}</span>
        )}
      </div>
    </div>
  );
}

function StatusPill({ status }) {
  return <span className={`status-pill status-${status.replace(/\s+/g, "-").toLowerCase()}`}>{status}</span>;
}

function RagBadge({ rag }) {
  return (
    <span className="rag-badge" style={{ "--rag-color": ragColor(rag) }}>
      <span className="rag-dot" />
      {rag}
    </span>
  );
}

function EditableField({ label, value, onChange, editMode, type = "text", options }) {
  return (
    <div className="field">
      <span className="field-label">{label}</span>
      {editMode ? (
        options ? (
          <select value={value} onChange={(e) => onChange(e.target.value)} className="field-input">
            {options.map((o) => <option key={o} value={o}>{o}</option>)}
          </select>
        ) : (
          <input
            type={type}
            value={value}
            onChange={(e) => onChange(e.target.value)}
            className="field-input"
          />
        )
      ) : (
        <span className="field-value">{value || "—"}</span>
      )}
    </div>
  );
}

function Dashboard({ employees, onSelect }) {
  const [query, setQuery] = useState("");
  const filtered = employees.filter((e) =>
    e.name.toLowerCase().includes(query.toLowerCase()) ||
    e.department.toLowerCase().includes(query.toLowerCase())
  );

  const counts = { Green: 0, Amber: 0, Red: 0 };
  employees.forEach((e) => counts[e.rag]++);
  const avgComposite = Math.round(
    employees.reduce((s, e) => s + compositeScore(e), 0) / employees.length
  );

  return (
    <div className="page">
      <div className="page-header">
        <div>
          <h1>Batch-2026-01 Overview</h1>
          <p className="page-sub">Tracking {employees.length} hires across Support, Enrolment, Premier, and SME.</p>

          </div>
        </div>
        <div className="stat-card">
          <div className="stat-icon" style={{ background: "var(--rag-green)" }}><Sparkles size={18} color="#fff" /></div>
          <div>
            <div className="stat-value">{counts.Green}</div>
            <div className="stat-label">On track (Green)</div>
          </div>
        </div>
        <div className="stat-card">
          <div className="stat-icon" style={{ background: "var(--rag-amber)" }}><Activity size={18} color="#fff" /></div>
          <div>
            <div className="stat-value">{counts.Amber}</div>
            <div className="stat-label">Needs support (Amber)</div>
          </div>
        </div>
        <div className="stat-card">
          <div className="stat-icon" style={{ background: "var(--rag-red)" }}><ShieldCheck size={18} color="#fff" /></div>
          <div>
            <div className="stat-value">{counts.Red}</div>
            <div className="stat-label">At risk (Red)</div>
          </div>
        </div>

      <div className="section-row">

        <div className="search-box">
          <Search size={15} />
          <input placeholder="Search by name or department..." value={query} onChange={(e) => setQuery(e.target.value)} />
        </div>
      </div>

      <div className="roster-grid">
        {filtered.map((e) => (
          <button key={e.id} className="employee-card" onClick={() => onSelect(e.id)}>
            <OrbitAvatar photo={e.photo} name={e.name} score={compositeScore(e)} />
            <div className="employee-card-info">
              <div className="employee-name">{e.name}</div>
              <div className="employee-role">{e.role}</div>
              <div className="employee-meta">
                <StatusPill status={e.status} />
                <RagBadge rag={e.rag} />
              </div>
            </div>
            <div className="employee-score">{compositeScore(e)}%</div>
          </button>
        ))}
      </div>
    </div>
  );
}

                  }} /> : row.owner}</td>

                    const next = [...emp.actionPlan]; next[i] = { ...row, targetDate: e.target.value }; onUpdate("actionPlan", next);

                  <td>{editMode ? (

          </table>

            <button className="add-row-btn" onClick={() => onUpdate("actionPlan", [...emp.actionPlan, { item: "", owner: "", targetDate: "", status: "Not Started" }])}>
              <Plus size={13} /> Add action item

          )}

      </div>

  );

function GenericTable({ rows, columns, onUpdate, editMode, addRowTemplate }) {
  return (
    <div className="table-wrap">
      <table className="data-table">
        <thead>
          <tr>{columns.map((c) => <th key={c.key}>{c.label}</th>)}{editMode && <th />}</tr>
        </thead>
        <tbody>
          {rows.map((row, i) => (
            <tr key={i}>
              {columns.map((c) => (
                <td key={c.key} className={c.mono ? "mono" : ""}>
                  {editMode ? (
                    <input
                      type={c.type || "text"}
                      value={row[c.key]}
                      onChange={(e) => {
                        const val = c.type === "number" ? Number(e.target.value) : e.target.value;
                        const next = [...rows]; next[i] = { ...row, [c.key]: val }; onUpdate(next);
                      }}
                    />
                  ) : c.type === "number" ? `${row[c.key]}%` : row[c.key]}
                </td>
              ))}
              {editMode && (
                <td><button className="icon-btn" onClick={() => onUpdate(rows.filter((_, idx) => idx !== i))}><Trash2 size={13} /></button></td>
              )}
            </tr>
          ))}
        </tbody>
      </table>
      {editMode && (
        <button className="add-row-btn" onClick={() => onUpdate([...rows, addRowTemplate])}>
          <Plus size={13} /> Add row
        </button>
      )}
    </div>
  );
}

/* ============================== AUTH ============================== */

function LoginScreen() {
  const [email, setEmail] = useState("");
  const [status, setStatus] = useState("idle"); // idle | sending | sent | error
  const [errorMsg, setErrorMsg] = useState("");

  const handleSubmit = async (e) => {
    e.preventDefault();
    setStatus("sending");
    const { error } = await supabase.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.href },
    });
    if (error) { setStatus("error"); setErrorMsg(error.message); }
    else setStatus("sent");
  };

  return (
    <div className="login-screen">
      <div className="login-constellation" />
      <div className="login-card">
        <div className="brand-mark login-brand-mark">Σ</div>
        <h1>Sigma Performance Hub</h1>
        <p>Sign in with your work email — we'll send a one-time link, no password needed.</p>
        {status === "sent" ? (
          <div className="login-sent">
            Check <strong>{email}</strong> for your sign-in link, then come back to this tab.
          </div>
        ) : (
          <form onSubmit={handleSubmit}>
            <input
              type="email" required placeholder="you@sigmataxpro.com"
              value={email} onChange={(e) => setEmail(e.target.value)}
            />
            <button type="submit" disabled={status === "sending"}>
              {status === "sending" ? "Sending…" : "Send sign-in link"}
            </button>
            {status === "error" && <div className="login-error">{errorMsg}</div>}
          </form>
        )}
      </div>
    </div>
  );
}

function AuthGate() {
  const [session, setSession] = useState(undefined); // undefined = loading, null = signed out
  const [profile, setProfile] = useState(null);

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session ?? null));
    const { data: listener } = supabase.auth.onAuthStateChange((_event, sess) => setSession(sess));
    return () => listener.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (session) {
      supabase.from("profiles").select("*").eq("id", session.user.id).single()
        .then(({ data }) => setProfile(data));
    } else {
      setProfile(null);
    }
  }, [session]);

  if (session === undefined) {
    return <div className="auth-loading"><style>{CSS}</style>Loading…</div>;
  }
  if (!session) {
    return <div className="auth-loading"><style>{CSS}</style><LoginScreen /></div>;
  }
  if (!profile) {
    return <div className="auth-loading"><style>{CSS}</style>Setting up your account…</div>;
  }

  return <App session={session} profile={profile} />;
}

/* ============================== APP ============================== */

function App({ session, profile }) {
  const isEditor = profile.role === "editor";
  const [employees, setEmployees] = useState([]);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState("dashboard");
  const [selectedId, setSelectedId] = useState(null);
  const [collapsed, setCollapsed] = useState(false);
  const [editMode, setEditMode] = useState(isEditor);

  useEffect(() => { setEditMode(isEditor); }, [isEditor]);

  useEffect(() => {
    let active = true;
    fetchEmployees().then((rows) => {
      if (active) { setEmployees(rows); setLoading(false); }
    });
    return () => { active = false; };
  }, []);

  const selected = useMemo(() => employees.find((e) => e.id === selectedId), [employees, selectedId]);

  const handleSelect = (id) => { setSelectedId(id); setView("profile"); };

  const handleUpdate = (id, field, value) => {
    setEmployees((prev) => prev.map((e) => (e.id === id ? { ...e, [field]: value } : e)));
    updateEmployeeField(id, field, value);
  };

  const handleSignOut = () => supabase.auth.signOut();

  if (loading) {
    return <div className="auth-loading"><style>{CSS}</style>Loading roster…</div>;
  }

  return (
    <div className="app-root">
      <style>{CSS}</style>
      <Sidebar
        view={view} setView={setView} collapsed={collapsed} setCollapsed={setCollapsed}
        editMode={editMode} setEditMode={setEditMode} isEditor={isEditor}
        userEmail={session.user.email} onSignOut={handleSignOut}
      />
      <div className="main-area">
        <div className="topbar">
          <div className="topbar-title">
            {view === "dashboard" && "Home"}
            {view === "roster" && "Roster"}
            {view === "settings" && "Settings"}
            {view === "profile" && selected && `Profile · ${selected.name}`}
          </div>
          <div className={`edit-indicator ${editMode ? "on" : ""}`}>
            {editMode ? <Unlock size={13} /> : <Lock size={13} />}
            {editMode ? "Editing enabled" : "View only"}
          </div>
        </div>

        {view === "dashboard" && <Dashboard employees={employees} onSelect={handleSelect} />}
        {view === "roster" && <RosterTable employees={employees} onSelect={handleSelect} />}
        {view === "settings" && <SettingsView />}
        {view === "profile" && selected && (
          <ProfileView emp={selected} editMode={editMode} onUpdate={handleUpdate} onBack={() => setView("roster")} />
        )}
      </div>
    </div>
  );
}

.mono { font-family: 'IBM Plex Mono', monospace; }
.data-table input, .data-table select { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 5px 7px; font-family: inherit; font-size: 12.5px; }

.chip-status { font-size: 10.5px; font-weight: 600; padding: 3px 8px; border-radius: 20px; background: var(--canvas); }
.chip-status.complete { background: rgba(46,158,109,0.12); color: var(--rag-green); }
.chip-status.in-progress { background: rgba(192,159,37,0.14); color: var(--gold-500); }
.chip-status.not-started { background: rgba(92,122,125,0.15); color: var(--muted); }

.add-row-btn, .icon-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--teal-700); font-size: 12.5px; font-weight: 500; cursor: pointer; padding: 10px 14px; }
.add-row-btn:hover { color: var(--gold-500); }
.icon-btn { padding: 4px; color: var(--rag-red); }

/* ---------- PROFILE ---------- */
.back-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--teal-700); font-size: 13px; font-weight: 500; cursor: pointer; margin-bottom: 16px; padding: 0; }
.profile-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.profile-header { display: flex; gap: 22px; padding: 26px 28px; border-bottom: 1px solid var(--border); background: linear-gradient(135deg, rgba(4,71,75,0.04), transparent); }
.profile-photo-wrap { position: relative; flex-shrink: 0; }
.photo-edit-btn {
  position: absolute; bottom: -2px; right: -2px; width: 26px; height: 26px; border-radius: 50%;
  background: var(--gold-500); border: 2px solid var(--surface); color: #fff; display: flex; align-items: center;
  justify-content: center; cursor: pointer;
}
.profile-header-fields { flex: 1; min-width: 0; }
.profile-title-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.profile-title-row h1 { font-family: 'Space Grotesk', sans-serif; font-size: 21px; margin: 0; color: var(--teal-900); }
.name-input { font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 600; border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; color: var(--teal-900); }

.field-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 20px; }
.field { display: flex; flex-direction: column; gap: 3px; }
.field-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; }
.field-value { font-size: 13.5px; color: var(--ink); font-weight: 500; }
.field-input { border: 1px solid var(--border); border-radius: 7px; padding: 5px 8px; font-size: 13px; font-family: inherit; }

.tab-bar { display: flex; gap: 2px; padding: 0 28px; border-bottom: 1px solid var(--border); background: var(--surface); overflow-x: auto; }
.tab-btn {
  display: flex; align-items: center; gap: 7px; background: none; border: none; padding: 13px 16px;
  font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.tab-btn.active { color: var(--teal-900); border-bottom-color: var(--gold-500); font-weight: 600; }
.tab-content { padding: 24px 28px 32px; }

/* ---------- OVERVIEW TAB ---------- */
.overview-grid { display: flex; flex-direction: column; gap: 22px; }
.summary-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.summary-card { background: var(--canvas); border-radius: 12px; padding: 14px; text-align: center; }
.summary-card.highlight { background: linear-gradient(135deg, var(--teal-900), var(--teal-700)); color: #fff; }
.summary-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); font-weight: 600; }
.summary-card.highlight .summary-label { color: rgba(255,255,255,0.7); }
.summary-value { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: var(--teal-900); margin-top: 4px; }
.summary-card.highlight .summary-value { color: var(--gold-300); }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.panel { background: var(--canvas); border-radius: 12px; padding: 16px; }
.panel h3 { font-family: 'Space Grotesk', sans-serif; font-size: 13.5px; margin: 0 0 12px; color: var(--teal-900); }
.placeholder-panel { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 40px; color: var(--muted); font-size: 13px; }

.chip-list-editor { display: flex; flex-direction: column; gap: 7px; }
.chip { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; }
.chip input { flex: 1; border: none; outline: none; font-size: 12.5px; font-family: inherit; background: transparent; }
.chip button { background: none; border: none; color: var(--rag-red); cursor: pointer; display: flex; }
.chip-add { display: flex; align-items: center; gap: 6px; background: none; border: 1px dashed var(--border); border-radius: 8px; padding: 7px 10px; font-size: 12px; color: var(--teal-700); cursor: pointer; justify-content: center; }

/* ---------- AUTH / LOGIN ---------- */
.auth-loading {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: var(--canvas); color: var(--muted); font-family: 'Inter', sans-serif; font-size: 14px;
}
.login-screen {
  position: relative; min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, var(--teal-900) 0%, var(--teal-950) 100%); overflow: hidden;
}
.login-constellation {
  position: absolute; inset: 0; opacity: 0.12;
  background-image:
    radial-gradient(circle at 20% 20%, var(--gold-300) 1px, transparent 1px),
    radial-gradient(circle at 70% 40%, var(--gold-300) 1px, transparent 1px),
    radial-gradient(circle at 40% 70%, var(--gold-300) 1px, transparent 1px),
    radial-gradient(circle at 85% 80%, var(--gold-300) 1px, transparent 1px);
  background-size: 180px 180px; animation: drift 30s linear infinite;
}
.login-card {
  position: relative; z-index: 1; background: var(--surface); border-radius: 18px; padding: 34px 30px;
  width: 320px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,0.3);
}
.login-brand-mark { margin: 0 auto 16px; }
.login-card h1 { font-family: 'Space Grotesk', sans-serif; font-size: 18px; color: var(--teal-900); margin: 0 0 8px; }
.login-card p { font-size: 12.5px; color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
.login-card form { display: flex; flex-direction: column; gap: 10px; }
.login-card input {
  border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; font-size: 13.5px; font-family: inherit;
}
.login-card button {
  border: none; border-radius: 9px; padding: 11px; background: var(--gold-500); color: var(--teal-950);
  font-weight: 700; font-size: 13.5px; cursor: pointer;
}
.login-card button:disabled { opacity: 0.6; cursor: default; }
.login-error { color: var(--rag-red); font-size: 12px; }
.login-sent { background: rgba(46,158,109,0.1); color: var(--rag-green); border-radius: 9px; padding: 12px; font-size: 13px; line-height: 1.5; }

/* ---------- SIDEBAR ACCOUNT BLOCK ---------- */
.sidebar-account { padding: 8px 12px; margin-bottom: 8px; }
.sidebar-account-email { font-size: 11.5px; color: rgba(255,255,255,0.85); word-break: break-all; }
.sidebar-account-role { font-size: 10.5px; color: var(--gold-300); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; margin-top: 2px; }
.signout-btn {
  width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.75);
  padding: 8px 12px; border-radius: 9px; font-size: 12px; font-weight: 500; cursor: pointer;
}
.signout-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

@media (max-width: 900px) {
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .field-grid { grid-template-columns: repeat(2, 1fr); }
  .two-col { grid-template-columns: 1fr; }
  .summary-cards { grid-template-columns: repeat(2, 1fr); }
}
`;
